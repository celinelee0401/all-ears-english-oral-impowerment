<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>AEE Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;--border:#2a2a35;--accent:#e8c547;--accent2:#f0a04b;--text:#f0ede8;--text-dim:#8a8799;--lindsay:#e8c547;--aubrey:#7eb8f7;--feedback-bg:#1a1f2e;--error:#f07070;--success:#70c99a;--radius:16px;--radius-sm:10px}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
    #app{display:flex;flex-direction:column;height:100vh}
    header{flex-shrink:0;padding:14px 20px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .logo{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent)}
    .logo span{color:var(--text-dim);font-size:.72rem;font-family:'DM Sans',sans-serif;display:block;font-weight:300}
    header nav{margin-left:auto;display:flex;gap:6px}
    .nav-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
    .nav-btn:hover,.nav-btn.active{border-color:var(--accent);color:var(--accent)}
    .screen{display:none;flex-direction:column;flex:1;min-height:0}
    .screen.active{display:flex}
    .step-bar{flex-shrink:0;display:flex;align-items:center;padding:11px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
    .step{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--text-dim)}
    .step.active{color:var(--accent)}.step.done{color:var(--success)}
    .step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:500}
    .step-line{flex:1;height:1px;background:var(--border);margin:0 8px}
    .scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

    /* ── 集數庫 ── */
    #library-screen .scroll-body{padding:16px;display:flex;flex-direction:column;gap:12px}
    .lib-header{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .lib-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent)}
    .add-btn{background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--radius-sm);padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer}
    .episode-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .2s}
    .episode-card:hover{border-color:var(--accent);background:rgba(232,197,71,.04)}
    .episode-card .ep-title{font-size:1rem;font-weight:500}
    .episode-card .ep-meta{font-size:.78rem;color:var(--text-dim)}
    .episode-card .ep-phrases{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
    .phrase-tag{background:rgba(232,197,71,.1);border:1px solid rgba(232,197,71,.2);color:var(--accent);border-radius:20px;padding:2px 9px;font-size:.72rem}
    .ep-actions{display:flex;gap:8px;margin-top:4px}
    .ep-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);border-radius:var(--radius-sm);padding:6px 12px;font-size:.78rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
    .ep-btn.primary{border-color:var(--accent);color:var(--accent)}
    .ep-btn.danger{border-color:var(--error);color:var(--error)}
    .ep-btn:hover{opacity:.8}
    .empty-lib{text-align:center;color:var(--text-dim);padding:40px 20px;font-size:.9rem;line-height:1.8}

    /* ── 新增集數 ── */
    #add-screen .scroll-body{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
    .add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px}
    .add-card h2{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent)}
    .field label{display:block;font-size:.78rem;color:var(--text-dim);margin-bottom:7px;letter-spacing:.05em;text-transform:uppercase}
    .field input,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;resize:vertical}
    .field input:focus,.field textarea:focus{border-color:var(--accent)}
    .field input::placeholder,.field textarea::placeholder{color:var(--text-dim)}
    .field textarea{min-height:120px;max-height:250px}
    .hint-text{font-size:.78rem;color:var(--text-dim);line-height:1.55;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px}
    .save-btn{background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--radius-sm);padding:14px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;width:100%}
    .save-btn:disabled{opacity:.4;cursor:not-allowed}
    .status-msg{font-size:.83rem;color:var(--text-dim);text-align:center;min-height:18px}
    .status-msg.error{color:var(--error)}.status-msg.success{color:var(--success)}

    /* ── 講解 ── */
    #explain-screen .scroll-body{padding:20px 16px;display:flex;flex-direction:column;gap:16px}
    .explain-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .explain-card h3{font-size:.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
    .explain-card p,.explain-card .explain-body{font-size:.93rem;line-height:1.7;white-space:pre-wrap}
    .vocab-grid{display:flex;flex-direction:column;gap:10px}
    .vocab-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
    .vocab-phrase{font-size:1rem;font-weight:500;color:var(--accent)}
    .vocab-meaning{font-size:.82rem;color:var(--text-dim)}
    .vocab-example{font-size:.85rem;font-style:italic;border-left:2px solid var(--border);padding-left:10px;margin-top:2px}
    .section-title{font-size:.75rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
    .role-select{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .role-btn{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;cursor:pointer;text-align:center;transition:all .2s;color:var(--text-dim)}
    .role-btn .name{font-size:1rem;font-weight:500;display:block}.role-btn .desc{font-size:.75rem;margin-top:2px}
    .role-btn.selected-lindsay{border-color:var(--lindsay);color:var(--lindsay);background:rgba(232,197,71,.08)}
    .role-btn.selected-aubrey{border-color:var(--aubrey);color:var(--aubrey);background:rgba(126,184,247,.08)}
    .start-practice-btn{background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--radius-sm);padding:14px;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;width:100%}
    .start-practice-btn:disabled{opacity:.4;cursor:not-allowed}
    .start-practice-btn:hover:not(:disabled){background:var(--accent2)}
    .back-btn{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-family:'DM Sans',sans-serif;font-size:.9rem;cursor:pointer;width:100%}

    /* ── Practice ── */
    .practice-header{flex-shrink:0;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .episode-title{font-size:.82rem;color:var(--text-dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icon-btn{background:rgba(232,197,71,.1);border:1px solid rgba(232,197,71,.25);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:.73rem;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
    .script-drawer{flex-shrink:0;background:var(--surface2);border-bottom:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s}
    .script-drawer.open{max-height:240px;padding:12px 16px;overflow-y:auto}
    .script-drawer-title{font-size:.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .script-line{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
    .script-speaker{font-size:.72rem;font-weight:600;padding-top:2px;min-width:52px;flex-shrink:0}
    .script-speaker.lindsay{color:var(--lindsay)}.script-speaker.aubrey{color:var(--aubrey)}
    .script-text{font-size:.85rem;line-height:1.5;color:var(--text)}
    .script-text.my-turn{color:var(--accent);font-weight:500}
    .hint-drawer{flex-shrink:0;background:var(--surface2);border-bottom:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s}
    .hint-drawer.open{max-height:160px;padding:12px 16px;overflow-y:auto}
    .hint-drawer-title{font-size:.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .hint-chips{display:flex;flex-wrap:wrap;gap:6px}
    .hint-chip{background:rgba(232,197,71,.08);border:1px solid rgba(232,197,71,.2);color:var(--text);border-radius:20px;padding:5px 12px;font-size:.82rem;cursor:pointer;transition:all .2s}
    .hint-chip:hover{background:rgba(232,197,71,.15);border-color:var(--accent);color:var(--accent)}
    .script-prompt{flex-shrink:0;background:rgba(232,197,71,.06);border-top:1px solid rgba(232,197,71,.15);padding:10px 16px;display:flex;align-items:center;gap:10px}
    .script-prompt.hidden{display:none}
    .script-prompt-label{font-size:.72rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
    .script-prompt-text{font-size:.9rem;color:var(--text);flex:1;line-height:1.4}
    .script-prompt-use{background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--radius-sm);padding:6px 12px;font-size:.78rem;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
    .chat-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
    .bubble-wrap{display:flex;flex-direction:column;gap:4px}
    .bubble-wrap.user{align-items:flex-end}.bubble-wrap.ai{align-items:flex-start}
    .role-label{font-size:.7rem;color:var(--text-dim);padding:0 8px;letter-spacing:.04em}
    .bubble-wrap.user .role-label{color:var(--aubrey)}.bubble-wrap.ai .role-label{color:var(--lindsay)}
    .bubble{max-width:82%;padding:12px 16px;border-radius:18px;font-size:.95rem;line-height:1.55}
    .bubble.user{background:rgba(126,184,247,.15);border:1px solid rgba(126,184,247,.25);border-bottom-right-radius:4px}
    .bubble.ai{background:rgba(232,197,71,.1);border:1px solid rgba(232,197,71,.2);border-bottom-left-radius:4px}
    .feedback-box{max-width:82%;background:var(--feedback-bg);border:1px solid rgba(126,184,247,.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:.82rem;color:var(--text-dim);line-height:1.5}
    .feedback-box strong{color:var(--aubrey)}
    .speaking-indicator{display:flex;align-items:center;gap:6px;padding:10px 16px;background:rgba(232,197,71,.08);border:1px solid rgba(232,197,71,.15);border-radius:18px;border-bottom-left-radius:4px;width:fit-content;color:var(--lindsay);font-size:.85rem}
    .dot-flashing{display:flex;gap:4px}
    .dot-flashing span{width:6px;height:6px;border-radius:50%;background:var(--lindsay);animation:blink 1.2s infinite}
    .dot-flashing span:nth-child(2){animation-delay:.2s}.dot-flashing span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    .controls{flex-shrink:0;padding:12px 16px 20px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
    .mic-row{display:flex;align-items:center;gap:12px}
    .mic-btn{width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:#0d0d0f;font-size:1.5rem;cursor:pointer;transition:all .2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .mic-btn:disabled{opacity:.3;cursor:not-allowed}.mic-btn.recording{background:var(--error);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,112,112,.4)}50%{box-shadow:0 0 0 12px rgba(240,112,112,0)}}
    .mic-status{flex:1;font-size:.88rem;color:var(--text-dim);line-height:1.4}
    .mic-status.listening{color:var(--error)}
    .transcript-preview{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;font-size:.88rem;min-height:42px;line-height:1.5;font-style:italic}
    .send-row{display:flex;gap:8px}
    .send-btn{flex:1;background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--radius-sm);padding:12px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .2s}
    .send-btn:disabled{opacity:.3;cursor:not-allowed}.send-btn:not(:disabled):hover{background:var(--accent2)}
    .clear-btn{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:.9rem;cursor:pointer;font-family:'DM Sans',sans-serif}

    /* ── 練習紀錄 ── */
    #records-screen .scroll-body{padding:20px 16px;display:flex;flex-direction:column;gap:12px}
    .records-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--accent)}
    .record-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
    .record-card .r-title{font-size:.95rem;font-weight:500}
    .record-card .r-meta{font-size:.78rem;color:var(--text-dim)}
    .record-card .r-phrases{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
    .empty-state{text-align:center;color:var(--text-dim);padding:40px 20px;font-size:.9rem;line-height:1.8}

    /* Loading */
    .loading-overlay{position:fixed;inset:0;background:rgba(13,13,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100}
    .loading-overlay.hidden{display:none}
    .loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{color:var(--text-dim);font-size:.9rem}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  </style>
</head>
<body>
<div id="app">

<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">處理中...</div>
</div>

<header>
  <div class="logo">All Ears English<span>口說練習 App</span></div>
  <nav>
    <button class="nav-btn active" id="nav-library" onclick="navTo('library')">集數庫</button>
    <button class="nav-btn" id="nav-records" onclick="navTo('records')">練習紀錄</button>
  </nav>
</header>

<!-- 集數庫 -->
<div id="library-screen" class="screen active">
  <div class="scroll-body">
    <div class="lib-header">
      <div class="lib-title">📚 集數庫</div>
      <button class="add-btn" onclick="navTo('add')">＋ 新增集數</button>
    </div>
    <div id="episode-list"><div class="empty-state">還沒有集數<br>點右上角「＋ 新增集數」開始新增</div></div>
  </div>
</div>

<!-- 新增集數 -->
<div id="add-screen" class="screen">
  <div class="scroll-body">
    <div class="add-card">
      <h2>＋ 新增集數</h2>
      <div class="field">
        <label>集數標題</label>
        <input type="text" id="ep-title" placeholder="例如：AEE 2612 - I'm Up for It If You Are"/>
      </div>
      <div class="field">
        <label>逐字稿全文</label>
        <textarea id="ep-transcript" style="min-height:160px" placeholder="從 Podcast App 複製整集逐字稿貼在這裡&#10;&#10;App 會自動找到「Let's start the roleplay」，把講解和 Roleplay 段落分開。"></textarea>
      </div>
      <div class="hint-text">💡 在 Apple Podcasts 或 Spotify 找到集數 → 點「逐字稿」→ 全選複製 → 貼入</div>
      <div class="status-msg" id="add-status"></div>
      <button class="save-btn" id="save-btn" onclick="saveEpisode()">💾 儲存並分析</button>
      <button class="back-btn" onclick="navTo('library')">← 返回</button>
    </div>
  </div>
</div>

<!-- 講解 + 選角色 -->
<div id="explain-screen" class="screen">
  <div class="step-bar">
    <div class="step done"><div class="step-num">✓</div><span>選集數</span></div>
    <div class="step-line"></div>
    <div class="step active"><div class="step-num">2</div><span>講解複習</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-num">3</div><span>Roleplay</span></div>
  </div>
  <div class="scroll-body">
    <div id="explain-content"></div>
  </div>
</div>

<!-- Practice -->
<div id="practice-screen" class="screen">
  <div class="step-bar">
    <div class="step done"><div class="step-num">✓</div><span>選集數</span></div>
    <div class="step-line"></div>
    <div class="step done"><div class="step-num">✓</div><span>講解複習</span></div>
    <div class="step-line"></div>
    <div class="step active"><div class="step-num">3</div><span>Roleplay</span></div>
  </div>
  <div class="practice-header">
    <button class="icon-btn" onclick="confirmLeave()" style="color:var(--text-dim);border-color:var(--border)">← 離開</button>
    <span class="episode-title" id="episode-title">練習中...</span>
    <button class="icon-btn" onclick="toggleScript()">📄 對照稿</button>
    <button class="icon-btn" onclick="toggleHints()">💡 提示</button>
  </div>
  <div class="script-drawer" id="script-drawer">
    <div class="script-drawer-title">📄 Roleplay 對照稿</div>
    <div id="script-lines"></div>
  </div>
  <div class="hint-drawer" id="hint-drawer">
    <div class="hint-drawer-title">點擊填入提示詞</div>
    <div class="hint-chips" id="hint-chips"></div>
  </div>
  <div class="script-prompt hidden" id="script-prompt">
    <div class="script-prompt-label">📖 你的台詞</div>
    <div class="script-prompt-text" id="script-prompt-text"></div>
    <button class="script-prompt-use" onclick="useScriptLine()">照著說</button>
  </div>
  <div class="chat-area" id="chat-area"></div>
  <div class="controls">
    <div class="mic-row">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
      <div class="mic-status" id="mic-status">按下麥克風開始說話</div>
    </div>
    <div class="transcript-preview" id="transcript-preview">你說的話會出現在這裡...</div>
    <div class="send-row">
      <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>傳送</button>
      <button class="clear-btn" onclick="clearTranscript()">清除</button>
    </div>
  </div>
</div>

<!-- 練習紀錄 -->
<div id="records-screen" class="screen">
  <div class="scroll-body">
    <div class="records-title">📋 練習紀錄</div>
    <div id="records-list"><div class="empty-state">還沒有練習紀錄</div></div>
  </div>
</div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyMKuliask1T8WIAZ4FVTclTtlW-e_I8Me2MxqgKHMXz5SsYhD2Jgdhdv2cePZdXYVq/exec';

let userRole='',aiRole='',currentEpisode=null,
    targetPhrases=[],hintCards=[],dialogue=[],
    conversationHistory=[],currentSessionId=null,
    recognition=null,isRecording=false,isAiSpeaking=false,
    userStoppedMic=false,pendingText='',dialogueIndex=0,
    practiceStartTime=null,turnCount=0;

// ── Nav ──
function navTo(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'-screen').classList.add('active');
  ['library','records'].forEach(n=>document.getElementById('nav-'+n)?.classList.toggle('active',n===name));
  if(name==='library')loadEpisodes();
  if(name==='records')loadRecords();
}

// ── 集數庫 ──
async function loadEpisodes(){
  const list=document.getElementById('episode-list');
  list.innerHTML='<div class="empty-state">載入中...</div>';
  try{
    const r=await fetch(GAS_URL+'?action=list_episodes');
    const d=await r.json();
    if(!d.episodes||d.episodes.length===0){
      list.innerHTML='<div class="empty-state">還沒有集數<br>點右上角「＋ 新增集數」開始新增</div>';return;
    }
    list.innerHTML=d.episodes.map(ep=>`
      <div class="episode-card">
        <div class="ep-title">${escHtml(ep.title)}</div>
        <div class="ep-meta">新增於 ${escHtml(ep.date||'')}</div>
        <div class="ep-phrases">${(ep.phrases||[]).map(p=>`<span class="phrase-tag">${escHtml(p)}</span>`).join('')}</div>
        <div class="ep-actions">
          <button class="ep-btn primary" onclick="openEpisode('${ep.id}')">▶ 開始練習</button>
          <button class="ep-btn danger" onclick="deleteEp('${ep.id}',this)">刪除</button>
        </div>
      </div>`).join('');
  }catch(err){list.innerHTML=`<div class="empty-state">載入失敗：${err.message}</div>`;}
}

async function deleteEp(id,btn){
  if(!confirm('確定要刪除這個集數嗎？'))return;
  btn.disabled=true;
  await gasPost({action:'delete_episode',id});
  loadEpisodes();
}

// ── 新增集數 ──
async function saveEpisode(){
  const title=document.getElementById('ep-title').value.trim();
  const transcript=document.getElementById('ep-transcript').value.trim();
  if(!title)return setAddStatus('請填寫集數標題','error');
  if(transcript.length<200)return setAddStatus('逐字稿太短，請貼上完整內容','error');
  document.getElementById('save-btn').disabled=true;
  setAddStatus('🧠 AI 分析中，請稍候...','');
  try{
    // 先分析
    const preview=await apiPost('/api/preview',{transcript});
    // 分割講解 vs Roleplay
    const {explanation,roleplay}=splitTranscript(transcript);
    // 存到 GAS
    await gasPost({
      action:'add_episode',title,transcript,
      explanation,roleplay,
      phrases:(preview.vocabulary||[]).map(v=>v.phrase)
    });
    // 存 preview data 到 localStorage 供後續使用
    localStorage.setItem('preview_'+title,JSON.stringify(preview));
    setAddStatus('✅ 儲存成功！','success');
    document.getElementById('ep-title').value='';
    document.getElementById('ep-transcript').value='';
    setTimeout(()=>navTo('library'),1000);
  }catch(err){
    setAddStatus('❌ 失敗：'+err.message,'error');
    document.getElementById('save-btn').disabled=false;
  }
}

function splitTranscript(text){
  // 找 "let's start the roleplay" 或類似標記（不分大小寫）
  const markers=['let\'s start the roleplay','let\'s do the roleplay','start the roleplay','roleplay time','start roleplay'];
  let splitIdx=-1;
  const lower=text.toLowerCase();
  for(const m of markers){
    const idx=lower.indexOf(m);
    if(idx>-1){splitIdx=idx;break;}
  }
  if(splitIdx===-1) return {explanation:text,roleplay:''};
  return {explanation:text.slice(0,splitIdx).trim(),roleplay:text.slice(splitIdx).trim()};
}

// ── 開始練習：載入集數 → 講解 ──
async function openEpisode(id){
  showLoading('載入集數...');
  try{
    const r=await fetch(GAS_URL+'?action=get_episode&id='+id);
    const ep=await r.json();
    if(ep.error)throw new Error(ep.error);
    currentEpisode=ep;

    // 取得 preview data（先查 localStorage，否則重新分析）
    let preview=null;
    const cached=localStorage.getItem('preview_'+ep.title);
    if(cached){preview=JSON.parse(cached);}
    else{
      updateLoading('🧠 AI 分析講解內容...');
      preview=await apiPost('/api/preview',{transcript:ep.transcript||ep.explanation});
      localStorage.setItem('preview_'+ep.title,JSON.stringify(preview));
    }

    targetPhrases=(preview.vocabulary||[]).map(v=>v.phrase);
    hintCards=preview.hint_cards||[];

    // 解析 Roleplay 對話
    if(ep.roleplay&&preview.dialogue){
      // 重新分析 Roleplay 段落的對話
      const rpPreview=await apiPost('/api/preview',{transcript:ep.roleplay||ep.transcript});
      dialogue=rpPreview.dialogue||preview.dialogue||[];
    } else {
      dialogue=preview.dialogue||[];
    }

    hideLoading();
    renderExplain(ep,preview);
    navTo('explain');
  }catch(err){hideLoading();alert('載入失敗：'+err.message);}
}

function renderExplain(ep,preview){
  const vocabHtml=(preview.vocabulary||[]).map(v=>`
    <div class="vocab-card">
      <div class="vocab-phrase">${escHtml(v.phrase)}</div>
      <div class="vocab-meaning">${escHtml(v.meaning)}</div>
      <div class="vocab-example">${escHtml(v.example)}</div>
    </div>`).join('');

  // 講解重點摘要
  const explainText=ep.explanation||'';
  const summaryHtml=preview.summary?`
    <div class="explain-card">
      <h3>📻 本集主題</h3>
      <p>${escHtml(preview.summary)}</p>
    </div>`:'';

  // 講解段落（只顯示前 800 字）
  const explainSnippet=explainText.length>800?explainText.slice(0,800)+'...(節錄)':explainText;
  const explainBodyHtml=explainText?`
    <div class="explain-card">
      <h3>📝 講解段落原文</h3>
      <div class="explain-body">${escHtml(explainSnippet)}</div>
    </div>`:'';

  document.getElementById('explain-content').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:16px;padding:20px 16px 8px">
      <div style="font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--accent)">${escHtml(ep.title||'')}</div>
      ${summaryHtml}
      <div class="section-title">🎯 本集目標詞彙（共 ${(preview.vocabulary||[]).length} 個）</div>
      <div class="vocab-grid">${vocabHtml}</div>
      ${explainBodyHtml}
      <div class="section-title">🎭 選擇你要扮演的角色</div>
      <div class="role-select">
        <div class="role-btn" id="role-lindsay" onclick="selectRole('Lindsay')"><span class="name">Lindsay</span><span class="desc">Boston・主導</span></div>
        <div class="role-btn" id="role-aubrey" onclick="selectRole('Aubrey')"><span class="name">Aubrey</span><span class="desc">紐約・回應</span></div>
      </div>
      <div class="status-msg" id="role-status">選擇角色後開始 Roleplay</div>
      <button class="start-practice-btn" id="start-practice-btn" onclick="startPractice()" disabled>🎙️ 開始 Roleplay →</button>
      <button class="back-btn" onclick="navTo('library')">← 返回集數庫</button>
    </div>`;
}

function selectRole(role){
  userRole=role;aiRole=role==='Lindsay'?'Aubrey':'Lindsay';
  document.getElementById('role-lindsay').className='role-btn'+(role==='Lindsay'?' selected-lindsay':'');
  document.getElementById('role-aubrey').className='role-btn'+(role==='Aubrey'?' selected-aubrey':'');
  document.getElementById('role-status').textContent='';
  document.getElementById('start-practice-btn').disabled=false;
}

function startPractice(){
  if(!userRole)return;
  currentSessionId='SES_'+Date.now();
  conversationHistory=[];dialogueIndex=0;turnCount=0;
  practiceStartTime=new Date();
  document.getElementById('chat-area').innerHTML='';
  document.getElementById('episode-title').textContent=currentEpisode?.title||'練習中';
  // 提示詞 chips
  document.getElementById('hint-chips').innerHTML=hintCards.map(h=>`<div class="hint-chip" onclick="useHint('${escAttr(h)}')">${escHtml(h)}</div>`).join('');
  // 對照稿（只用 Roleplay 段落的 dialogue）
  renderScriptLines();
  navTo('practice');
  addBubble('ai','Hey! Ready to dive into the roleplay? I\'m '+aiRole+', and you\'re playing '+userRole+'. Let\'s go! 🎧');
  showNextMyLine();
  setupSpeechRecognition();
}

function renderScriptLines(){
  document.getElementById('script-lines').innerHTML=dialogue.map((line,i)=>{
    const isMe=line.speaker===userRole;
    return `<div class="script-line"><div class="script-speaker ${line.speaker.toLowerCase()}">${escHtml(line.speaker)}</div><div class="script-text${isMe?' my-turn':''}">${escHtml(line.text)}</div></div>`;
  }).join('');
}

function showNextMyLine(){
  for(let i=dialogueIndex;i<dialogue.length;i++){
    if(dialogue[i].speaker===userRole){
      document.getElementById('script-prompt-text').textContent=dialogue[i].text;
      document.getElementById('script-prompt').classList.remove('hidden');
      dialogueIndex=i;return;
    }
  }
  document.getElementById('script-prompt').classList.add('hidden');
}

function useScriptLine(){
  pendingText=document.getElementById('script-prompt-text').textContent;
  document.getElementById('transcript-preview').textContent=pendingText;
  document.getElementById('send-btn').disabled=false;
  document.getElementById('script-prompt').classList.add('hidden');
}

function toggleScript(){document.getElementById('script-drawer').classList.toggle('open');}
function toggleHints(){document.getElementById('hint-drawer').classList.toggle('open');}
function useHint(text){pendingText=(pendingText+' '+text).trim();document.getElementById('transcript-preview').textContent=pendingText;document.getElementById('send-btn').disabled=false;document.getElementById('hint-drawer').classList.remove('open');}

// ── Speech ──
function setupSpeechRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('mic-status').textContent='⚠️ 請用 Chrome';document.getElementById('mic-btn').disabled=true;return;}
  recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=true;
  recognition.onstart=()=>{isRecording=true;document.getElementById('mic-btn').classList.add('recording');document.getElementById('mic-btn').textContent='⏹';document.getElementById('mic-status').textContent='🔴 聆聽中...（說完按⏹）';document.getElementById('mic-status').className='mic-status listening';};
  recognition.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)pendingText=(pendingText+' '+e.results[i][0].transcript).trim();
      else interim+=e.results[i][0].transcript;
    }
    document.getElementById('transcript-preview').textContent=pendingText+(interim?' '+interim:'')||'說話中...';
    document.getElementById('send-btn').disabled=!pendingText;
  };
  recognition.onend=()=>{
    isRecording=false;document.getElementById('mic-btn').classList.remove('recording');document.getElementById('mic-btn').textContent='🎤';
    if(!isAiSpeaking&&!userStoppedMic){try{recognition.start();}catch(e){}}
    else{document.getElementById('mic-status').textContent=pendingText?'✅ 確認後按「傳送」':'按下麥克風開始說話';document.getElementById('mic-status').className='mic-status';}
  };
  recognition.onerror=(e)=>{isRecording=false;document.getElementById('mic-btn').classList.remove('recording');document.getElementById('mic-btn').textContent='🎤';if(e.error!=='no-speech')document.getElementById('mic-status').textContent='❌ '+e.error;};
}

function toggleMic(){
  if(!recognition)return;
  if(isRecording){userStoppedMic=true;recognition.stop();document.getElementById('mic-status').textContent=pendingText?'✅ 確認後按「傳送」':'按下麥克風開始說話';document.getElementById('mic-status').className='mic-status';}
  else{userStoppedMic=false;pendingText='';document.getElementById('transcript-preview').textContent='說話中...';document.getElementById('send-btn').disabled=true;recognition.start();}
}
function clearTranscript(){pendingText='';document.getElementById('transcript-preview').textContent='你說的話會出現在這裡...';document.getElementById('send-btn').disabled=true;}

// ── Send ──
async function sendMessage(){
  const text=pendingText.trim();if(!text||isAiSpeaking)return;
  clearTranscript();document.getElementById('send-btn').disabled=true;document.getElementById('mic-btn').disabled=true;
  turnCount++;
  addBubble('user',text);conversationHistory.push({role:'user',content:text});
  dialogueIndex++;
  const indicator=addTypingIndicator();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userMessage:text,transcript:currentEpisode?.roleplay||currentEpisode?.transcript||'',
        history:conversationHistory.slice(-10),targetPhrases})});
    const data=await res.json();if(!res.ok||data.error)throw new Error(data.error);
    indicator.remove();
    addBubble('ai',data.dialoguePart);
    if(data.feedbackPart)addFeedback(data.feedbackPart);
    conversationHistory.push({role:'assistant',content:data.reply});
    dialogueIndex++;
    await speak(data.dialoguePart);
    showNextMyLine();
  }catch(err){indicator.remove();addBubble('ai','⚠️ 連線錯誤（'+err.message+'）');}
  document.getElementById('mic-btn').disabled=false;document.getElementById('send-btn').disabled=false;
}

// ── Save Record ──
async function saveRecord(){
  if(!currentEpisode||turnCount===0)return;
  try{
    await gasPost({
      action:'save_record',
      episodeId:currentEpisode.id,
      episodeTitle:currentEpisode.title,
      role:userRole,
      turns:turnCount,
      phrases:targetPhrases.slice(0,5),
      note:''
    });
  }catch(e){console.log('紀錄儲存失敗',e);}
}

// ── Records ──
async function loadRecords(){
  // 從 GAS 讀取（因 CORS 限制，改從 localStorage 快取顯示）
  const list=document.getElementById('records-list');
  const records=JSON.parse(localStorage.getItem('aee_records')||'[]');
  if(!records.length){list.innerHTML='<div class="empty-state">還沒有練習紀錄<br>完成一次 Roleplay 後會出現在這裡</div>';return;}
  list.innerHTML=records.map(r=>`
    <div class="record-card">
      <div class="r-title">${escHtml(r.episodeTitle||'')}</div>
      <div class="r-meta">${r.date} ・ 扮演 ${r.role} ・ ${r.turns} 輪對話</div>
      <div class="r-phrases">${(r.phrases||[]).map(p=>`<span class="phrase-tag">${escHtml(p)}</span>`).join('')}</div>
    </div>`).join('');
}

function saveLocalRecord(){
  if(!currentEpisode||turnCount===0)return;
  const records=JSON.parse(localStorage.getItem('aee_records')||'[]');
  records.unshift({
    id:'REC_'+Date.now(),
    date:new Date().toLocaleDateString('zh-TW'),
    episodeId:currentEpisode.id,
    episodeTitle:currentEpisode.title,
    role:userRole,turns:turnCount,
    phrases:targetPhrases.slice(0,5)
  });
  localStorage.setItem('aee_records',JSON.stringify(records.slice(0,100)));
  saveRecord(); // 同步存到 GAS
}

// ── UI Helpers ──
function addBubble(who,text){const chat=document.getElementById('chat-area');const rn=who==='ai'?aiRole:userRole;const w=document.createElement('div');w.className='bubble-wrap '+who;w.innerHTML=`<div class="role-label">${rn}</div><div class="bubble ${who}">${escHtml(text)}</div>`;chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w;}
function addFeedback(text){const chat=document.getElementById('chat-area');const b=document.createElement('div');b.className='bubble-wrap ai';b.innerHTML=`<div class="feedback-box"><strong>💬 回饋</strong><br>${escHtml(text)}</div>`;chat.appendChild(b);chat.scrollTop=chat.scrollHeight;}
function addTypingIndicator(){const chat=document.getElementById('chat-area');const w=document.createElement('div');w.className='bubble-wrap ai';w.innerHTML=`<div class="role-label">${aiRole}</div><div class="speaking-indicator"><div class="dot-flashing"><span></span><span></span><span></span></div>${aiRole} 正在回覆...</div>`;chat.appendChild(w);chat.scrollTop=chat.scrollHeight;return w;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function escAttr(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showLoading(msg){document.getElementById('loading-text').textContent=msg;document.getElementById('loading-overlay').classList.remove('hidden');}
function updateLoading(msg){document.getElementById('loading-text').textContent=msg;}
function hideLoading(){document.getElementById('loading-overlay').classList.add('hidden');}
function setAddStatus(msg,type){const el=document.getElementById('add-status');el.textContent=msg;el.className='status-msg'+(type?' '+type:'');document.getElementById('save-btn').disabled=false;}

function speak(text){return new Promise(resolve=>{if(!window.speechSynthesis)return resolve();
  if(isRecording&&recognition)recognition.stop();
  document.getElementById('mic-btn').disabled=true;document.getElementById('mic-btn').classList.remove('recording');document.getElementById('mic-btn').textContent='🎤';
  window.speechSynthesis.cancel();isAiSpeaking=true;document.getElementById('mic-status').textContent='🔊 '+aiRole+' 說話中...';
  const utt=new SpeechSynthesisUtterance(text);utt.lang='en-US';utt.rate=0.92;utt.pitch=1.05;
  const f=window.speechSynthesis.getVoices().find(x=>x.lang.startsWith('en')&&/female|samantha|karen|victoria|moira/i.test(x.name));
  if(f)utt.voice=f;
  utt.onend=utt.onerror=()=>{isAiSpeaking=false;userStoppedMic=false;document.getElementById('mic-btn').disabled=false;document.getElementById('mic-status').textContent='按下麥克風開始說話';
    // 儲存紀錄
    saveLocalRecord();
    resolve();};
  window.speechSynthesis.speak(utt);
});}

// ── API ──
async function apiPost(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'API 錯誤');return d;
}
async function gasPost(body){
  const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
  return r.json();
}

function confirmLeave(){
  if(turnCount>0){
    if(confirm('要結束練習並儲存紀錄嗎？')){saveLocalRecord();navTo('library');}
  } else {
    navTo('library');
  }
}

window.speechSynthesis?.getVoices();
window.speechSynthesis?.addEventListener?.('voiceschanged',()=>window.speechSynthesis.getVoices());
// 離開練習頁時儲存紀錄
window.addEventListener('beforeunload',saveLocalRecord);
</script>
